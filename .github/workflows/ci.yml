name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Secrets check
        run: |
          FOUND=$(git grep -nE "cloudinary_api_secret|CLOUDINARY_API_SECRET=|service_role|SUPABASE_SERVICE" -- ':!.github' ':!.env.example' ':!AGENTS.md' ':!ARCHITECTURE.md' ':!*.md' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Secrets found in code!"
            echo "$FOUND"
            exit 1
          fi

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/ml-service
          pip install -e ".[dev]"

      - name: Ruff
        run: cd apps/ml-service && ruff check .

      - name: MyPy
        run: cd apps/ml-service && mypy .

      - name: Test
        run: cd apps/ml-service && pytest
